<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150">
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto">
      <path d="M0,0 L20,10 L0,20 z" fill="#555"/>
    </marker>
    <marker id="r" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1500" height="1150" fill="#fff"/>
  <text x="40" y="45" font-family="Segoe UI, Arial" font-size="29" font-weight="700" fill="#222">9.3 · InitiativesPage — state, useEffect, and the 3 screens</text>

  <!-- ===== A: STATE BOXES ===== -->
  <text x="40" y="88" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#444">A · The page's memory = 3 state boxes   <tspan font-weight="400" font-size="17">const [value, setValue] = useState(startValue)</tspan></text>
  <g font-family="Segoe UI, Arial">
    <rect x="40" y="102" width="450" height="100" rx="10" fill="#eaf2ff" stroke="#1f6fd1" stroke-width="2"/>
    <text x="58" y="130" font-size="19" font-weight="700" fill="#1f6fd1">items</text>
    <text x="58" y="158" font-family="Consolas, monospace" font-size="16" fill="#222">const [items, setItems] = useState([])</text>
    <text x="58" y="186" font-size="15" fill="#444">the list from the backend · starts empty [ ]</text>

    <rect x="525" y="102" width="450" height="100" rx="10" fill="#fff6d6" stroke="#e0b100" stroke-width="2"/>
    <text x="543" y="130" font-size="19" font-weight="700" fill="#b08a00">loading</text>
    <text x="543" y="158" font-family="Consolas, monospace" font-size="16" fill="#222">const [loading, setLoading] = useState(true)</text>
    <text x="543" y="186" font-size="15" fill="#444">true until the first fetch finishes</text>

    <rect x="1010" y="102" width="450" height="100" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="1028" y="130" font-size="19" font-weight="700" fill="#c0392b">error</text>
    <text x="1028" y="158" font-family="Consolas, monospace" font-size="16" fill="#222">const [error, setError] = useState(null)</text>
    <text x="1028" y="186" font-size="15" fill="#444">null = no error · otherwise the message</text>
  </g>
  <text x="40" y="232" font-family="Segoe UI, Arial" font-size="18" fill="#222">⭐ Calling <tspan font-weight="700">setX(newValue)</tspan> = React saves the new value AND <tspan font-weight="700">re-renders</tspan> (runs the component function again → new screen).</text>

  <!-- ===== B: TIMELINE ===== -->
  <text x="40" y="285" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#444">B · What happens when you open the page (in time order)</text>

  <!-- card 1 -->
  <rect x="40" y="300" width="330" height="350" rx="12" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
  <text x="58" y="332" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#222">① First render</text>
  <g font-family="Segoe UI, Arial" font-size="15" fill="#333">
    <text x="58" y="364">React runs InitiativesPage()</text>
    <text x="58" y="388">loading is <tspan font-weight="700">true</tspan> (start value)</text>
    <text x="58" y="412">→ first if returns</text>
    <text x="58" y="436" font-family="Consolas, monospace">&lt;p&gt;Loading...&lt;/p&gt;</text>
  </g>
  <!-- card 2 -->
  <rect x="400" y="300" width="330" height="350" rx="12" fill="#f3ecff" stroke="#7b3fd1" stroke-width="2"/>
  <text x="418" y="332" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#7b3fd1">② useEffect runs</text>
  <text x="418" y="356" font-family="Segoe UI, Arial" font-size="14" fill="#7b3fd1">AFTER the screen is drawn</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#222">
    <text x="418" y="386">useEffect(() =&gt; {</text>
    <text x="438" y="408">apiFetch("/initiatives")</text>
    <text x="418" y="430">}, <tspan fill="#c0392b" font-weight="700">[]</tspan>);</text>
  </g>
  <text x="418" y="456" font-family="Segoe UI, Arial" font-size="14" fill="#c0392b"><tspan font-weight="700">[]</tspan> = run only ONCE, on first load</text>
  <!-- card 3 -->
  <rect x="760" y="300" width="330" height="350" rx="12" fill="#eafaf0" stroke="#1e9e5a" stroke-width="2"/>
  <text x="778" y="332" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#1e9e5a">③ Answer arrives → set state</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#222">
    <text x="778" y="366"><tspan fill="#1e9e5a" font-weight="700">✔</tspan> .then(d =&gt; setItems(d.items))</text>
    <text x="778" y="392"><tspan fill="#c0392b" font-weight="700">✖</tspan> .catch(e =&gt; setError(e.message))</text>
    <text x="778" y="418"><tspan fill="#555" font-weight="700">●</tspan> .finally(() =&gt; setLoading(false))</text>
  </g>
  <g font-family="Segoe UI, Arial" font-size="13" fill="#555">
    <text x="778" y="440">✔ success · ✖ error (thrown by api.js) · ● always</text>
  </g>
  <!-- card 4 -->
  <rect x="1120" y="300" width="340" height="350" rx="12" fill="#eaf2ff" stroke="#1f6fd1" stroke-width="2"/>
  <text x="1138" y="332" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#1f6fd1">④ Re-render (new state)</text>
  <g font-family="Segoe UI, Arial" font-size="15" fill="#333">
    <text x="1138" y="364">React runs InitiativesPage() again</text>
    <text x="1138" y="388">loading false → skip 1st if</text>
    <text x="1138" y="412">error null → skip 2nd if</text>
    <text x="1138" y="436">items has 3 → <tspan font-weight="700">show the list</tspan></text>
  </g>

  <!-- state chips per card -->
  <g font-family="Consolas, monospace" font-size="13">
    <!-- c1 -->
    <rect x="55" y="470" width="98" height="26" rx="5" fill="#eaf2ff" stroke="#1f6fd1"/><text x="62" y="488">items []</text>
    <rect x="158" y="470" width="110" height="26" rx="5" fill="#fff6d6" stroke="#e0b100"/><text x="164" y="488">loading true</text>
    <rect x="273" y="470" width="88" height="26" rx="5" fill="#fdecea" stroke="#c0392b"/><text x="278" y="488">error null</text>
    <!-- c2 -->
    <rect x="415" y="470" width="98" height="26" rx="5" fill="#eaf2ff" stroke="#1f6fd1"/><text x="422" y="488">items []</text>
    <rect x="518" y="470" width="110" height="26" rx="5" fill="#fff6d6" stroke="#e0b100"/><text x="524" y="488">loading true</text>
    <rect x="633" y="470" width="88" height="26" rx="5" fill="#fdecea" stroke="#c0392b"/><text x="638" y="488">error null</text>
    <!-- c3 -->
    <rect x="775" y="470" width="98" height="26" rx="5" fill="#1f6fd1"/><text x="780" y="488" fill="#fff">items [3]</text>
    <rect x="878" y="470" width="110" height="26" rx="5" fill="#e0b100"/><text x="882" y="488" fill="#fff">loading false</text>
    <rect x="993" y="470" width="88" height="26" rx="5" fill="#fdecea" stroke="#c0392b"/><text x="998" y="488">error null</text>
    <!-- c4 -->
    <rect x="1135" y="470" width="98" height="26" rx="5" fill="#eaf2ff" stroke="#1f6fd1"/><text x="1140" y="488">items [3]</text>
    <rect x="1238" y="470" width="114" height="26" rx="5" fill="#fff6d6" stroke="#e0b100"/><text x="1242" y="488">loading false</text>
    <rect x="1357" y="470" width="90" height="26" rx="5" fill="#fdecea" stroke="#c0392b"/><text x="1362" y="488">error null</text>
  </g>

  <!-- mini screens -->
  <g font-family="Segoe UI, Arial">
    <rect x="55" y="510" width="300" height="125" rx="6" fill="#fff" stroke="#999"/><rect x="55" y="510" width="300" height="18" rx="6" fill="#ddd"/>
    <text x="75" y="575" font-size="18" fill="#555">Loading...</text>

    <rect x="415" y="510" width="300" height="125" rx="6" fill="#fff" stroke="#999"/><rect x="415" y="510" width="300" height="18" rx="6" fill="#ddd"/>
    <text x="435" y="575" font-size="18" fill="#555">Loading...</text>
    <text x="435" y="612" font-size="14" fill="#7b3fd1">⏳ GET /initiatives → waiting...</text>

    <rect x="775" y="510" width="300" height="125" rx="6" fill="#f0fff5" stroke="#1e9e5a" stroke-dasharray="6 4"/>
    <text x="790" y="555" font-size="15" fill="#1e9e5a" font-weight="700">setItems / setLoading called</text>
    <text x="790" y="582" font-size="15" fill="#333">→ React: "state changed,</text>
    <text x="790" y="604" font-size="15" fill="#333">   draw the page again"</text>

    <rect x="1135" y="510" width="310" height="125" rx="6" fill="#fff" stroke="#999"/><rect x="1135" y="510" width="310" height="18" rx="6" fill="#ddd"/>
    <text x="1150" y="550" font-size="16" font-weight="700" fill="#222">Initiatives</text>
    <rect x="1150" y="558" width="280" height="20" fill="#f3f3f3"/><text x="1156" y="573" font-size="13">AI pilot · planned · 500</text>
    <rect x="1150" y="582" width="280" height="20" fill="#f3f3f3"/><text x="1156" y="597" font-size="13">Data lake · active · 900</text>
    <rect x="1150" y="606" width="280" height="20" fill="#f3f3f3"/><text x="1156" y="621" font-size="13">CRM revamp · done · 300</text>
  </g>
  <!-- timeline arrows -->
  <line x1="372" y1="572" x2="410" y2="572" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
  <line x1="732" y1="572" x2="770" y2="572" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1092" y1="572" x2="1130" y2="572" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <!-- ===== C: WHICH SCREEN ===== -->
  <text x="40" y="700" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#444">C · Every render, the code checks top → bottom and shows ONE screen</text>
  <rect x="40" y="715" width="640" height="225" rx="12" fill="#1e2430"/>
  <g font-family="Consolas, monospace" font-size="16" fill="#e6e6e6">
    <text x="60" y="750"><tspan fill="#c792ea">if</tspan> (loading) <tspan fill="#c792ea">return</tspan> &lt;p&gt;Loading...&lt;/p&gt;;</text>
    <text x="60" y="785"><tspan fill="#c792ea">if</tspan> (error)   <tspan fill="#c792ea">return</tspan> &lt;p&gt;Error: {error}&lt;/p&gt;;</text>
    <text x="60" y="820"><tspan fill="#c792ea">return</tspan> ( ... form ...</text>
    <text x="80" y="852">{items.length === 0</text>
    <text x="100" y="882">? &lt;p&gt;No initiatives yet&lt;/p&gt;</text>
    <text x="100" y="912">: &lt;ul&gt;{items.map(item =&gt; &lt;li <tspan fill="#ffcb6b">key={item.id}</tspan>&gt;...)}&lt;/ul&gt;}</text>
  </g>
  
  <g font-family="Segoe UI, Arial">
    <rect x="732" y="715" width="175" height="225" rx="8" fill="#fff6d6" stroke="#e0b100"/>
    <text x="745" y="740" font-size="14" font-weight="700" fill="#b08a00">loading = true</text>
    <text x="745" y="800" font-size="17" fill="#555">Loading...</text>
    <text x="745" y="900" font-size="13" fill="#555">page just opened</text>

    <rect x="917" y="715" width="175" height="225" rx="8" fill="#fdecea" stroke="#c0392b"/>
    <text x="930" y="740" font-size="14" font-weight="700" fill="#c0392b">error = "Not auth..."</text>
    <text x="930" y="800" font-size="15" fill="#c0392b">Error: Not</text>
    <text x="930" y="820" font-size="15" fill="#c0392b">authenticated</text>
    <text x="930" y="900" font-size="13" fill="#555">no token / server down</text>

    <rect x="1102" y="715" width="175" height="225" rx="8" fill="#f7f7f7" stroke="#999"/>
    <text x="1115" y="740" font-size="14" font-weight="700" fill="#555">items = [ ]</text>
    <text x="1115" y="800" font-size="15" fill="#555">No initiatives yet.</text>
    <text x="1115" y="820" font-size="15" fill="#555">Add one above.</text>
    <text x="1115" y="900" font-size="13" fill="#555">worked, but empty</text>

    <rect x="1287" y="715" width="175" height="225" rx="8" fill="#eaf2ff" stroke="#1f6fd1"/>
    <text x="1300" y="740" font-size="14" font-weight="700" fill="#1f6fd1">items = [3 rows]</text>
    <rect x="1300" y="770" width="150" height="22" fill="#fff" stroke="#ccc"/><text x="1306" y="786" font-size="12">AI pilot  [Delete]</text>
    <rect x="1300" y="797" width="150" height="22" fill="#fff" stroke="#ccc"/><text x="1306" y="813" font-size="12">Data lake [Delete]</text>
    <rect x="1300" y="824" width="150" height="22" fill="#fff" stroke="#ccc"/><text x="1306" y="840" font-size="12">CRM revamp [Delete]</text>
    <text x="1300" y="900" font-size="13" fill="#555">normal case</text>
  </g>

  <!-- ===== D: [] and key ===== -->
  <rect x="40" y="965" width="700" height="165" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="60" y="995" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#c0392b">Why the [ ] in useEffect(..., [ ])?</text>
  <g font-family="Segoe UI, Arial" font-size="16" fill="#222">
    <text x="60" y="1025">[ ] = "run once, after the first render". WITHOUT it, it runs after EVERY render:</text>
    <text x="60" y="1058" font-weight="700" fill="#c0392b">render → effect → fetch → setItems → render → effect → fetch → ... ∞</text>
    <text x="60" y="1090">= infinite loop, the backend gets spammed.</text>
    <text x="60" y="1115" font-size="14" fill="#555">(In dev you may see 2 fetches: that's StrictMode testing you, not a bug.)</text>
  </g>

  <rect x="760" y="965" width="700" height="165" rx="12" fill="#fffaf0" stroke="#e0b100" stroke-width="2"/>
  <text x="780" y="995" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#b08a00">Why key={item.id} on each &lt;li&gt;?</text>
  <g font-family="Segoe UI, Arial" font-size="16" fill="#222">
    <text x="780" y="1025">.map() turns each item into a row. key = the row's name tag,</text>
    <text x="780" y="1050">so after a delete/add React knows WHICH row changed</text>
    <text x="780" y="1075">and updates only that row.</text>
    <text x="780" y="1105">Use a stable id, <tspan font-weight="700">not the index</tspan> — indexes shift after a delete.</text>
  </g>
  <g font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="655" cy="745" r="13" fill="#e0b100"/><text x="655" y="750">1</text>
    <circle cx="655" cy="780" r="13" fill="#c0392b"/><text x="655" y="785">2</text>
    <circle cx="655" cy="877" r="13" fill="#888"/><text x="655" y="882">3</text>
    <circle cx="655" cy="907" r="13" fill="#1f6fd1"/><text x="655" y="912">4</text>
    <circle cx="890" cy="735" r="13" fill="#e0b100"/><text x="890" y="740">1</text>
    <circle cx="1075" cy="760" r="13" fill="#c0392b"/><text x="1075" y="765">2</text>
    <circle cx="1260" cy="735" r="13" fill="#888"/><text x="1260" y="740">3</text>
    <circle cx="1445" cy="760" r="13" fill="#1f6fd1"/><text x="1445" y="765">4</text>
  </g>
</svg>
