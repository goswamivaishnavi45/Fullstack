<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130">
  <defs>
    <marker id="r" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#c0392b"/>
    </marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1500" height="1130" fill="#fff"/>
  <text x="40" y="45" font-family="Segoe UI, Arial" font-size="29" font-weight="700" fill="#222">9.2 · Where is each job in api.js — and where does the error GO?</text>

  <!-- ===== CODE PANEL ===== -->
  <rect x="40" y="70" width="860" height="640" rx="12" fill="#1e2430"/>
  <!-- highlights -->
  <rect x="48" y="93" width="844" height="30" rx="5" fill="#1f6fd1" opacity="0.45"/>
  <rect x="48" y="175" width="844" height="30" rx="5" fill="#1e9e5a" opacity="0.5"/>
  <rect x="48" y="319" width="844" height="30" rx="5" fill="#7b3fd1" opacity="0.55"/>
  <rect x="48" y="351" width="844" height="30" rx="5" fill="#1e9e5a" opacity="0.5"/>
  <rect x="48" y="463" width="844" height="160" rx="5" fill="#c0392b" opacity="0.45"/>
  <rect x="48" y="631" width="844" height="30" rx="5" fill="#888" opacity="0.45"/>

  <g font-family="Consolas, monospace" font-size="18" fill="#7f8796">
    <text x="58" y="115">5</text><text x="58" y="165">7</text><text x="58" y="197">8</text>
    <text x="52" y="245">10</text><text x="52" y="277">11</text><text x="52" y="309">12</text>
    <text x="52" y="341">13</text><text x="52" y="373">14</text><text x="52" y="405">15</text>
    <text x="52" y="437">16</text><text x="52" y="485">19</text><text x="52" y="517">20</text>
    <text x="52" y="549">21</text><text x="52" y="581">22</text><text x="52" y="613">23</text>
    <text x="52" y="653">25</text><text x="52" y="685">26</text>
  </g>
  <g font-family="Consolas, monospace" font-size="18" fill="#e6e6e6" xml:space="preserve">
    <text x="95" y="115">const API_URL = <tspan fill="#c3e88d">"http://localhost:8000"</tspan>;</text>
    <text x="95" y="165"><tspan fill="#c792ea">export async function</tspan> apiFetch(path, options = {}) {</text>
    <text x="115" y="197">const token = localStorage.getItem(<tspan fill="#c3e88d">"token"</tspan>);</text>
    <text x="115" y="245">const res = <tspan fill="#c792ea">await</tspan> fetch(API_URL + path, {</text>
    <text x="135" y="277">...options,           <tspan fill="#7f8796">// method, body</tspan></text>
    <text x="135" y="309">headers: {</text>
    <text x="155" y="341"><tspan fill="#c3e88d">"Content-Type"</tspan>: <tspan fill="#c3e88d">"application/json"</tspan>,</text>
    <text x="155" y="373">...(token ? { Authorization: <tspan fill="#c3e88d">`Bearer ${token}`</tspan> } : {}),</text>
    <text x="135" y="405">},</text>
    <text x="115" y="437">});</text>
    <text x="115" y="485"><tspan fill="#c792ea">if</tspan> (!res.ok) {          <tspan fill="#ffd1cc">// 401/403/404/422 land here</tspan></text>
    <text x="135" y="517">const body = <tspan fill="#c792ea">await</tspan> res.json();   <tspan fill="#ffd1cc">// {"detail": "..."}</tspan></text>
    <text x="135" y="549">const msg = body.detail;          <tspan fill="#ffd1cc">// the message</tspan></text>
    <text x="135" y="581"><tspan fill="#ff7b72" font-weight="700">throw new Error(msg);</tspan>      <tspan fill="#ffd1cc" font-weight="700">← THROWN HERE</tspan></text>
    <text x="115" y="613">}</text>
    <text x="115" y="653"><tspan fill="#c792ea">return</tspan> res.status === 204 ? null : res.json();</text>
    <text x="95" y="685">}</text>
  </g>
  <!-- badges -->
  <g font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="872" cy="108" r="15" fill="#1f6fd1"/><text x="872" y="114">1</text>
    <circle cx="872" cy="190" r="15" fill="#1e9e5a"/><text x="872" y="196">2</text>
    <circle cx="872" cy="334" r="15" fill="#7b3fd1"/><text x="872" y="340">3</text>
    <circle cx="872" cy="366" r="15" fill="#1e9e5a"/><text x="872" y="372">2</text>
    <circle cx="872" cy="543" r="15" fill="#c0392b"/><text x="872" y="549">4</text>
    <circle cx="872" cy="646" r="15" fill="#888"/><text x="872" y="652">5</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <rect x="940" y="70" width="520" height="250" rx="12" fill="#f7f7f7" stroke="#bbb" stroke-width="2"/>
  <text x="960" y="102" font-family="Segoe UI, Arial" font-size="21" font-weight="700" fill="#222">Written ONCE here, used by every component</text>
  <g font-family="Segoe UI, Arial" font-size="17" fill="#222">
    <circle cx="972" cy="134" r="12" fill="#1f6fd1"/><text x="992" y="140"><tspan font-weight="700">Base URL</tspan> — line 5</text>
    <circle cx="972" cy="170" r="12" fill="#1e9e5a"/><text x="992" y="176"><tspan font-weight="700">Token</tspan> — read (line 8) + Bearer header (line 14)</text>
    <circle cx="972" cy="206" r="12" fill="#7b3fd1"/><text x="992" y="212"><tspan font-weight="700">JSON header</tspan> — line 13</text>
    <circle cx="972" cy="242" r="12" fill="#c0392b"/><text x="992" y="248"><tspan font-weight="700">Error handling</tspan> — lines 19–23: check, read, THROW</text>
    <circle cx="972" cy="278" r="12" fill="#888"/><text x="992" y="284"><tspan font-weight="700">204 → null</tspan> — line 25 (no body)</text>
  </g>
  <g font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="972" y="140">1</text><text x="972" y="176">2</text><text x="972" y="212">3</text><text x="972" y="248">4</text><text x="972" y="284">5</text>
  </g>

  <!-- ===== WHERE IT LANDS ===== -->
  <text x="940" y="358" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#c0392b">The thrown error lands in the CALLER's catch:</text>
  <line x1="895" y1="575" x2="938" y2="420" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>
  <line x1="895" y1="580" x2="938" y2="530" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>
  <line x1="895" y1="585" x2="938" y2="645" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>

  <g font-family="Segoe UI, Arial">
    <rect x="940" y="372" width="520" height="100" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="955" y="397" font-size="16" font-weight="700" fill="#c0392b">A · InitiativesPage → useEffect (load list)</text>
    <text x="955" y="424" font-family="Consolas, monospace" font-size="16" fill="#222">.catch((err) =&gt; setError(err.message))</text>
    <text x="955" y="455" font-size="16" fill="#222">screen shows → <tspan font-weight="700">Error: Not authenticated</tspan></text>

    <rect x="940" y="485" width="520" height="100" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="955" y="510" font-size="16" font-weight="700" fill="#c0392b">B · InitiativesPage → handleDelete</text>
    <text x="955" y="537" font-family="Consolas, monospace" font-size="16" fill="#222">catch (err) { alert(err.message) }</text>
    <text x="955" y="568" font-size="16" fill="#222">popup → <tspan font-weight="700">You can only change your own initiatives</tspan></text>

    <rect x="940" y="598" width="520" height="112" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="955" y="623" font-size="16" font-weight="700" fill="#c0392b">C · InitiativeForm → handleSubmit (create)</text>
    <text x="955" y="650" font-family="Consolas, monospace" font-size="16" fill="#222">catch (err) { setError(err.message) }</text>
    <text x="955" y="681" font-size="16" fill="#222">red text under the form → <tspan font-weight="700">Not authenticated</tspan></text>
  </g>

  <!-- ===== 403 vs network ===== -->
  <rect x="40" y="740" width="700" height="360" rx="12" fill="#fffaf0" stroke="#e0b100" stroke-width="2"/>
  <text x="60" y="775" font-family="Segoe UI, Arial" font-size="21" font-weight="700" fill="#222">Does fetch throw by itself? Two cases</text>

  <g font-family="Segoe UI, Arial" font-size="15">
    <text x="60" y="810" font-weight="700" fill="#555">CASE 1 · server DOWN / CORS blocked</text>
    <rect x="60" y="822" width="130" height="60" rx="8" fill="#eee" stroke="#888"/><text x="125" y="857" text-anchor="middle">fetch(...)</text>
    <line x1="190" y1="852" x2="228" y2="852" stroke="#555" stroke-width="2.5" marker-end="url(#g)"/>
    <rect x="230" y="822" width="190" height="60" rx="8" fill="#fdecea" stroke="#c0392b"/><text x="325" y="848" text-anchor="middle" font-weight="700">✖ NO reply at all</text><text x="325" y="869" text-anchor="middle">nothing came back</text>
    <line x1="420" y1="852" x2="458" y2="852" stroke="#555" stroke-width="2.5" marker-end="url(#g)"/>
    <rect x="460" y="822" width="260" height="60" rx="8" fill="#c0392b"/><text x="590" y="848" text-anchor="middle" fill="#fff" font-weight="700">fetch THROWS by itself</text><text x="590" y="869" text-anchor="middle" fill="#fff">"Failed to fetch" → catch</text>

    <text x="60" y="925" font-weight="700" fill="#555">CASE 2 · server REPLIES with 403</text>
    <rect x="60" y="937" width="130" height="70" rx="8" fill="#eee" stroke="#888"/><text x="125" y="977" text-anchor="middle">fetch(...)</text>
    <line x1="190" y1="972" x2="228" y2="972" stroke="#555" stroke-width="2.5" marker-end="url(#g)"/>
    <rect x="230" y="937" width="190" height="70" rx="8" fill="#eafaf0" stroke="#1e9e5a"/><text x="325" y="962" text-anchor="middle" font-weight="700">✔ got a reply</text><text x="325" y="983" text-anchor="middle">status 403, ok=false</text><text x="325" y="1000" text-anchor="middle" fill="#c0392b">fetch does NOT throw</text>
    <line x1="420" y1="972" x2="458" y2="972" stroke="#555" stroke-width="2.5" marker-end="url(#g)"/>
    <rect x="460" y="937" width="260" height="70" rx="8" fill="#c0392b"/><text x="590" y="964" text-anchor="middle" fill="#fff" font-weight="700">OUR line 22 throws</text><text x="590" y="987" text-anchor="middle" fill="#fff">new Error(detail) → catch</text>

    <text x="60" y="1045" font-size="16" fill="#222">Either way the component only needs <tspan font-weight="700">one catch()</tspan> for both kinds of error.</text>
    <text x="60" y="1072" font-size="16" fill="#222">Without line 22, a 403 would look like success and the UI would break silently.</text>
  </g>

  <!-- ===== without vs with ===== -->
  <rect x="760" y="740" width="700" height="360" rx="12" fill="#f7f7f7" stroke="#bbb" stroke-width="2"/>
  <text x="780" y="775" font-family="Segoe UI, Arial" font-size="21" font-weight="700" fill="#222">Why ONE helper? Without vs with</text>
  <rect x="780" y="790" width="660" height="175" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="795" y="813" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#c0392b">✖ WITHOUT — copied into EVERY component (list, create, delete, login...)</text>
  <g font-family="Consolas, monospace" font-size="14.5" fill="#222" xml:space="preserve">
    <text x="795" y="840">const res = await fetch("http://localhost:8000/initiatives", {</text>
    <text x="811" y="862">headers: { "Content-Type": "application/json",</text>
    <text x="827" y="884">Authorization: `Bearer ${localStorage.getItem("token")}` } });</text>
    <text x="795" y="906">if (!res.ok) { const b = await res.json(); throw new Error(b.detail); }</text>
    <text x="795" y="928">const data = await res.json();</text>
    <text x="795" y="952" font-family="Segoe UI, Arial" fill="#c0392b">→ 5 lines × every call. Change the port? Edit every file.</text>
  </g>
  <rect x="780" y="978" width="660" height="105" rx="8" fill="#eafaf0" stroke="#1e9e5a"/>
  <text x="795" y="1003" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#1e9e5a">✔ WITH apiFetch — every component writes just:</text>
  <text x="795" y="1035" font-family="Consolas, monospace" font-size="17" fill="#222">const data = await apiFetch("/initiatives");</text>
  <text x="795" y="1065" font-family="Segoe UI, Arial" font-size="15" fill="#1e9e5a">→ change URL / token / error logic in ONE file (api.js)</text>
</svg>
