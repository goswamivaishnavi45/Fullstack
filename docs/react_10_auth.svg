<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180">
  <defs>
    <marker id="k" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#555"/></marker>
    <marker id="p" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#7b3fd1"/></marker>
  </defs>
  <rect width="1500" height="1180" fill="#fff"/>
  <text x="40" y="45" font-family="Segoe UI, Arial" font-size="29" font-weight="700" fill="#222">Step 10 · AuthContext, routes, protected page, login flow</text>

  <!-- ===== A: TREE ===== -->
  <text x="40" y="88" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#444">A · The component tree (App.jsx) — Context = a shared box every component can open</text>
  <g font-family="Segoe UI, Arial">
    <rect x="40" y="105" width="760" height="110" rx="12" fill="#f3ecff" stroke="#7b3fd1" stroke-width="3"/>
    <text x="60" y="137" font-size="20" font-weight="700" fill="#7b3fd1">&lt;AuthProvider&gt;   (AuthContext.jsx)</text>
    <rect x="60" y="152" width="720" height="48" rx="8" fill="#7b3fd1"/>
    <text x="78" y="183" font-family="Consolas, monospace" font-size="17" fill="#fff">value = { token, login(), logout() }   ← the shared box</text>

    <rect x="80" y="240" width="680" height="55" rx="10" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
    <text x="100" y="274" font-size="18" font-weight="700" fill="#444">&lt;BrowserRouter&gt; → &lt;Routes&gt;   picks a page by URL</text>

    <!-- login branch -->
    <rect x="80" y="330" width="300" height="60" rx="10" fill="#f7f7f7" stroke="#999"/>
    <text x="96" y="366" font-family="Consolas, monospace" font-size="16" fill="#222">path="/login"</text>
    <rect x="80" y="420" width="300" height="80" rx="10" fill="#fff6d6" stroke="#e0b100" stroke-width="2"/>
    <text x="96" y="450" font-size="18" font-weight="700" fill="#b08a00">LoginPage</text>
    <text x="96" y="480" font-family="Consolas, monospace" font-size="15" fill="#222">const { login } = useAuth()</text>

    <!-- protected branch -->
    <rect x="460" y="330" width="300" height="60" rx="10" fill="#f7f7f7" stroke="#999"/>
    <text x="476" y="366" font-family="Consolas, monospace" font-size="16" fill="#222">path="/"</text>
    <rect x="460" y="420" width="300" height="80" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="476" y="450" font-size="18" font-weight="700" fill="#c0392b">ProtectedRoute</text>
    <text x="476" y="480" font-family="Consolas, monospace" font-size="15" fill="#222">const { token } = useAuth()</text>
    <rect x="460" y="530" width="300" height="80" rx="10" fill="#eaf2ff" stroke="#1f6fd1" stroke-width="2"/>
    <text x="476" y="560" font-size="18" font-weight="700" fill="#1f6fd1">InitiativesPage</text>
    <text x="476" y="590" font-family="Consolas, monospace" font-size="15" fill="#222">const { logout } = useAuth()</text>
    <rect x="460" y="640" width="300" height="55" rx="10" fill="#eafaf0" stroke="#1e9e5a" stroke-width="2"/>
    <text x="476" y="674" font-size="17" font-weight="700" fill="#1e9e5a">InitiativeForm  (prop onCreate)</text>
  </g>
  <g stroke="#555" stroke-width="2.5">
    <line x1="420" y1="215" x2="420" y2="236" marker-end="url(#k)"/>
    <line x1="300" y1="295" x2="240" y2="326" marker-end="url(#k)"/>
    <line x1="540" y1="295" x2="600" y2="326" marker-end="url(#k)"/>
    <line x1="230" y1="390" x2="230" y2="416" marker-end="url(#k)"/>
    <line x1="610" y1="390" x2="610" y2="416" marker-end="url(#k)"/>
    <line x1="610" y1="500" x2="610" y2="526" marker-end="url(#k)"/>
    <line x1="610" y1="610" x2="610" y2="636" marker-end="url(#k)"/>
  </g>
  <!-- useAuth dashed lines up to provider -->
  <g stroke="#7b3fd1" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
    <path d="M80,460 C20,460 20,200 56,190" marker-end="url(#p)"/>
    <path d="M760,460 C830,450 830,200 784,190" marker-end="url(#p)"/>
    <path d="M760,570 C860,560 860,190 784,180" marker-end="url(#p)"/>
  </g>
  <text x="840" y="420" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#7b3fd1">useAuth() reads</text>
  <text x="840" y="440" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#7b3fd1">the box directly —</text>
  <text x="840" y="460" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#7b3fd1">no props passed</text>
  <text x="840" y="480" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#7b3fd1">through the levels</text>

  <!-- ===== B: PROTECTED ROUTE ===== -->
  <rect x="1000" y="105" width="460" height="250" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="1020" y="137" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#c0392b">B · ProtectedRoute = a guard</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#222">
    <text x="1020" y="172">const { token } = useAuth();</text>
    <text x="1020" y="200"><tspan fill="#7b3fd1">if</tspan> (!token)</text>
    <text x="1040" y="224"><tspan fill="#7b3fd1">return</tspan> &lt;Navigate to="/login" /&gt;;</text>
    <text x="1020" y="252"><tspan fill="#7b3fd1">return</tspan> children;</text>
  </g>
  <g font-family="Segoe UI, Arial" font-size="15" fill="#222">
    <text x="1020" y="288">no token → redirect to /login</text>
    <text x="1020" y="312">token → show &lt;InitiativesPage /&gt; (children)</text>
    <text x="1020" y="338" font-size="13" fill="#555">Only UI: the REAL security is the backend's 401/403.</text>
  </g>

  <!-- ===== C: LOGIN FLOW ===== -->
  <text x="40" y="745" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#444">C · Login flow, step by step</text>
  <g font-family="Segoe UI, Arial">
    <rect x="40" y="760" width="220" height="140" rx="10" fill="#fff6d6" stroke="#e0b100" stroke-width="2"/>
    <text x="55" y="788" font-size="16" font-weight="700" fill="#b08a00">① LoginPage</text>
    <text x="55" y="814" font-size="14">type email + password</text>
    <text x="55" y="836" font-size="14">(controlled inputs)</text>
    <text x="55" y="866" font-family="Consolas, monospace" font-size="13">await login(email, pw)</text>

    <rect x="280" y="760" width="290" height="140" rx="10" fill="#f3ecff" stroke="#7b3fd1" stroke-width="2"/>
    <text x="295" y="788" font-size="16" font-weight="700" fill="#7b3fd1">② login() in AuthContext</text>
    <text x="295" y="814" font-family="Consolas, monospace" font-size="13">POST /auth/login</text>
    <text x="295" y="836" font-family="Consolas, monospace" font-size="13">body: URLSearchParams({</text>
    <text x="305" y="856" font-family="Consolas, monospace" font-size="13">username: email, password })</text>
    <text x="295" y="882" font-size="13" fill="#555">FORM data, not JSON (OAuth2)</text>

    <rect x="590" y="760" width="260" height="140" rx="10" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
    <text x="605" y="788" font-size="16" font-weight="700" fill="#222">③ FastAPI (Step 6)</text>
    <text x="605" y="814" font-size="14">OAuth2PasswordRequestForm</text>
    <text x="605" y="836" font-size="14">verify Argon2 hash</text>
    <text x="605" y="858" font-size="14">→ 200 {access_token}</text>
    <text x="605" y="880" font-size="14" fill="#c0392b">wrong → 401 (shown in form)</text>

    <rect x="870" y="760" width="290" height="140" rx="10" fill="#eafaf0" stroke="#1e9e5a" stroke-width="2"/>
    <text x="885" y="788" font-size="16" font-weight="700" fill="#1e9e5a">④ save the token</text>
    <text x="885" y="814" font-family="Consolas, monospace" font-size="13">localStorage.setItem(...)</text>
    <text x="885" y="834" font-size="13" fill="#555">→ survives refresh, api.js reads it</text>
    <text x="885" y="860" font-family="Consolas, monospace" font-size="13">setToken(...)</text>
    <text x="885" y="880" font-size="13" fill="#555">→ context changes → app re-renders</text>

    <rect x="1180" y="760" width="280" height="140" rx="10" fill="#eaf2ff" stroke="#1f6fd1" stroke-width="2"/>
    <text x="1195" y="788" font-size="16" font-weight="700" fill="#1f6fd1">⑤ navigate("/")</text>
    <text x="1195" y="814" font-size="14">ProtectedRoute sees token</text>
    <text x="1195" y="836" font-size="14">→ InitiativesPage loads</text>
    <text x="1195" y="858" font-size="14">→ apiFetch adds</text>
    <text x="1195" y="880" font-family="Consolas, monospace" font-size="13">Authorization: Bearer ...</text>
  </g>
  <g stroke="#555" stroke-width="2.5">
    <line x1="262" y1="830" x2="276" y2="830" marker-end="url(#k)"/>
    <line x1="572" y1="830" x2="586" y2="830" marker-end="url(#k)"/>
    <line x1="852" y1="830" x2="866" y2="830" marker-end="url(#k)"/>
    <line x1="1162" y1="830" x2="1176" y2="830" marker-end="url(#k)"/>
  </g>
  <text x="40" y="930" font-family="Segoe UI, Arial" font-size="15" fill="#222"><tspan font-weight="700">Logout:</tspan> remove from localStorage + setToken(null) → ProtectedRoute redirects to /login.   <tspan font-weight="700">Token expired:</tspan> api.js gets 401 → clears token → goes to /login.</text>

  <!-- ===== D: STORAGE ===== -->
  <text x="40" y="975" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#444">D · Where to keep the token? (trade-offs — common interview question)</text>
  <g font-family="Segoe UI, Arial" font-size="15">
    <rect x="40" y="990" width="460" height="170" rx="10" fill="#fff6d6" stroke="#e0b100" stroke-width="2"/>
    <text x="58" y="1018" font-size="17" font-weight="700" fill="#b08a00">localStorage  ← we use this</text>
    <text x="58" y="1046" fill="#1e9e5a">✔ simple · survives refresh</text>
    <text x="58" y="1072" fill="#c0392b">✖ any JS on the page can read it</text>
    <text x="72" y="1094" fill="#c0392b">→ an XSS bug could steal the token</text>
    <text x="58" y="1124" fill="#555">fix: short expiry (our 30 min), escape output</text>

    <rect x="520" y="990" width="460" height="170" rx="10" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
    <text x="538" y="1018" font-size="17" font-weight="700" fill="#444">Memory (React state only)</text>
    <text x="538" y="1046" fill="#1e9e5a">✔ not stored anywhere on disk</text>
    <text x="538" y="1072" fill="#c0392b">✖ lost on every page refresh</text>
    <text x="552" y="1094" fill="#c0392b">→ user must log in again</text>
    <text x="538" y="1124" fill="#555">often paired with a refresh token</text>

    <rect x="1000" y="990" width="460" height="170" rx="10" fill="#eafaf0" stroke="#1e9e5a" stroke-width="2"/>
    <text x="1018" y="1018" font-size="17" font-weight="700" fill="#1e9e5a">httpOnly cookie  ← most secure</text>
    <text x="1018" y="1046" fill="#1e9e5a">✔ JavaScript CANNOT read it → safe from XSS</text>
    <text x="1018" y="1072" fill="#1e9e5a">✔ browser sends it automatically</text>
    <text x="1018" y="1098" fill="#c0392b">✖ needs CSRF protection + backend changes</text>
    <text x="1018" y="1124" fill="#555">(cookie set by FastAPI, SameSite, credentials)</text>
  </g>
</svg>
