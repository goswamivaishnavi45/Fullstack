<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="760" fill="#f8fafc"/>
<text x="600.0" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">How pagination works: skip + limit</text>
<text x="600.0" y="75" text-anchor="middle" font-size="15" fill="#475569">Example: 7 initiatives in the database, the UI shows 3 per page (limit = 3)</text>
<text x="85" y="122" font-size="16" font-weight="700" fill="#0f172a">A. The rows in the database, sorted by id (ORDER BY id)</text>
<rect x="85" y="140" width="130" height="80" rx="10" fill="white" stroke="#2563eb" stroke-width="2.5"/>
<text x="150.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">id 1</text>
<text x="150.0" y="192" text-anchor="middle" font-size="14" fill="#0f172a">Init 1</text>
<text x="150.0" y="210" text-anchor="middle" font-size="12" fill="#64748b">active</text>
<rect x="235" y="140" width="130" height="80" rx="10" fill="white" stroke="#2563eb" stroke-width="2.5"/>
<text x="300.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">id 2</text>
<text x="300.0" y="192" text-anchor="middle" font-size="14" fill="#0f172a">Init 2</text>
<text x="300.0" y="210" text-anchor="middle" font-size="12" fill="#64748b">planned</text>
<rect x="385" y="140" width="130" height="80" rx="10" fill="white" stroke="#2563eb" stroke-width="2.5"/>
<text x="450.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">id 3</text>
<text x="450.0" y="192" text-anchor="middle" font-size="14" fill="#0f172a">Init 3</text>
<text x="450.0" y="210" text-anchor="middle" font-size="12" fill="#64748b">active</text>
<rect x="535" y="140" width="130" height="80" rx="10" fill="white" stroke="#059669" stroke-width="2.5"/>
<text x="600.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#059669">id 4</text>
<text x="600.0" y="192" text-anchor="middle" font-size="14" fill="#0f172a">Init 4</text>
<text x="600.0" y="210" text-anchor="middle" font-size="12" fill="#64748b">planned</text>
<rect x="685" y="140" width="130" height="80" rx="10" fill="white" stroke="#059669" stroke-width="2.5"/>
<text x="750.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#059669">id 5</text>
<text x="750.0" y="192" text-anchor="middle" font-size="14" fill="#0f172a">Init 5</text>
<text x="750.0" y="210" text-anchor="middle" font-size="12" fill="#64748b">active</text>
<rect x="835" y="140" width="130" height="80" rx="10" fill="white" stroke="#059669" stroke-width="2.5"/>
<text x="900.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#059669">id 6</text>
<text x="900.0" y="192" text-anchor="middle" font-size="14" fill="#0f172a">Init 6</text>
<text x="900.0" y="210" text-anchor="middle" font-size="12" fill="#64748b">planned</text>
<rect x="985" y="140" width="130" height="80" rx="10" fill="white" stroke="#d97706" stroke-width="2.5"/>
<text x="1050.0" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#d97706">id 7</text>
<text x="1050.0" y="192" text-anchor="middle" font-size="14" fill="#0f172a">Init 7</text>
<text x="1050.0" y="210" text-anchor="middle" font-size="12" fill="#64748b">active</text>
<path d="M85,232 v12 H515 v-12" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="300.0" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">Page 1</text>
<text x="300.0" y="294" text-anchor="middle" font-size="13.5" font-family="Consolas, monospace" fill="#0f172a">?skip=0&amp;limit=3</text>
<text x="300.0" y="314" text-anchor="middle" font-size="12.5" fill="#64748b">skip 0 rows, take 3</text>
<path d="M535,232 v12 H965 v-12" fill="none" stroke="#059669" stroke-width="2.5"/>
<text x="750.0" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#059669">Page 2</text>
<text x="750.0" y="294" text-anchor="middle" font-size="13.5" font-family="Consolas, monospace" fill="#0f172a">?skip=3&amp;limit=3</text>
<text x="750.0" y="314" text-anchor="middle" font-size="12.5" fill="#64748b">skip 3 rows, take 3</text>
<path d="M985,232 v12 H1115 v-12" fill="none" stroke="#d97706" stroke-width="2.5"/>
<text x="1050.0" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d97706">Page 3</text>
<text x="1050.0" y="294" text-anchor="middle" font-size="13.5" font-family="Consolas, monospace" fill="#0f172a">?skip=6&amp;limit=3</text>
<text x="1050.0" y="314" text-anchor="middle" font-size="12.5" fill="#64748b">skip 6 rows, take 3</text>
<rect x="85" y="345" width="1030" height="52" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="600" y="377" text-anchor="middle" font-size="16" fill="#1e1b4b"><tspan font-weight="700">skip = (page − 1) × limit</tspan>      page 1 → skip 0   ·   page 2 → skip 3   ·   page 3 → skip 6      (total 7 → 3 pages)</text>
<text x="85" y="442" font-size="16" font-weight="700" fill="#0f172a">B. What happens for ONE request (page 2)</text>
<rect x="85" y="462" width="190" height="130" rx="10" fill="white" stroke="#2563eb" stroke-width="2"/>
<rect x="85" y="462" width="190" height="34" rx="10" fill="#2563eb"/><rect x="85" y="486" width="190" height="10" fill="#2563eb"/>
<text x="180.0" y="485" text-anchor="middle" font-size="14.5" font-weight="700" fill="white">1 · React / browser</text>
<text x="180.0" y="524" text-anchor="middle" font-size="13" fill="#0f172a">sends the request:</text>
<text x="180.0" y="548" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">GET /initiatives</text>
<text x="180.0" y="572" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">?skip=3&amp;limit=3</text>
<line x1="277" y1="527" x2="293" y2="527" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="295" y="462" width="190" height="130" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
<rect x="295" y="462" width="190" height="34" rx="10" fill="#7c3aed"/><rect x="295" y="486" width="190" height="10" fill="#7c3aed"/>
<text x="390.0" y="485" text-anchor="middle" font-size="14.5" font-weight="700" fill="white">2 · pagination()</text>
<text x="390.0" y="524" text-anchor="middle" font-size="13" fill="#0f172a">deps.py reads the URL</text>
<text x="390.0" y="548" text-anchor="middle" font-size="13" fill="#0f172a">checks limit is 1-100</text>
<text x="390.0" y="572" text-anchor="middle" font-size="13" fill="#0f172a">page = {skip: 3, limit: 3}</text>
<line x1="487" y1="527" x2="503" y2="527" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="505" y="462" width="190" height="130" rx="10" fill="white" stroke="#0891b2" stroke-width="2"/>
<rect x="505" y="462" width="190" height="34" rx="10" fill="#0891b2"/><rect x="505" y="486" width="190" height="10" fill="#0891b2"/>
<text x="600.0" y="485" text-anchor="middle" font-size="14.5" font-weight="700" fill="white">3 · router</text>
<text x="600.0" y="524" text-anchor="middle" font-size="13" fill="#0f172a">list_initiatives(db, page)</text>
<text x="600.0" y="548" text-anchor="middle" font-size="13" fill="#0f172a">just calls the service</text>
<text x="600.0" y="572" text-anchor="middle" font-size="13" fill="#0f172a">with skip=3, limit=3</text>
<line x1="697" y1="527" x2="713" y2="527" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="715" y="462" width="190" height="130" rx="10" fill="white" stroke="#059669" stroke-width="2"/>
<rect x="715" y="462" width="190" height="34" rx="10" fill="#059669"/><rect x="715" y="486" width="190" height="10" fill="#059669"/>
<text x="810.0" y="485" text-anchor="middle" font-size="14.5" font-weight="700" fill="white">4 · service → DB</text>
<text x="810.0" y="524" text-anchor="middle" font-size="13" fill="#0f172a">SELECT ... ORDER BY id</text>
<text x="810.0" y="548" text-anchor="middle" font-size="13" fill="#0f172a">LIMIT 3 OFFSET 3</text>
<text x="810.0" y="572" text-anchor="middle" font-size="13" fill="#0f172a">+ COUNT(*) = 7</text>
<line x1="907" y1="527" x2="923" y2="527" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="925" y="462" width="190" height="130" rx="10" fill="white" stroke="#d97706" stroke-width="2"/>
<rect x="925" y="462" width="190" height="34" rx="10" fill="#d97706"/><rect x="925" y="486" width="190" height="10" fill="#d97706"/>
<text x="1020.0" y="485" text-anchor="middle" font-size="14.5" font-weight="700" fill="white">5 · response</text>
<text x="1020.0" y="524" text-anchor="middle" font-size="13" fill="#0f172a">&quot;items&quot;: [id 4, 5, 6]</text>
<text x="1020.0" y="548" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">&quot;total&quot;: 7</text>
<text x="1020.0" y="572" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">&quot;skip&quot;: 3, &quot;limit&quot;: 3</text>
<rect x="85" y="625" width="1030" height="112" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="109" y="655" font-size="16" font-weight="700" fill="#0f172a">Why do it this way?</text>
<text x="109" y="681" font-size="13.5" fill="#334155">• Never send ALL rows at once: 1 million rows would be slow and crash the browser. limit is capped at 100.</text>
<text x="109" y="703" font-size="13.5" fill="#334155">• total tells the UI how many pages exist (7 rows / 3 per page = 3 pages) so it can show “Page 2 of 3”.</text>
<text x="109" y="725" font-size="13.5" fill="#334155">• ORDER BY id keeps the order fixed, so the same row never appears on two pages or gets skipped.</text>
</svg>