<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1330" viewBox="0 0 1500 1330">
  <defs>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#1f6fd1"/></marker>
    <marker id="o" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#d35400"/></marker>
    <marker id="p" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#7b3fd1"/></marker>
  </defs>
  <rect width="1500" height="1330" fill="#fff"/>
  <text x="40" y="45" font-family="Segoe UI, Arial" font-size="29" font-weight="700" fill="#222">How the files connect — follow ONE click on "Add" (numbers 0 → 9)</text>
  <text x="40" y="78" font-family="Segoe UI, Arial" font-size="18" fill="#444">Left = PARENT file · Right = CHILD file · Bottom = api.js. Same numbers in the code and in the steps list below.</text>

  <!-- ===== LEFT: PARENT ===== -->
  <rect x="40" y="100" width="660" height="570" rx="12" fill="#1e2430"/>
  <rect x="40" y="100" width="660" height="44" rx="12" fill="#1f6fd1"/><rect x="40" y="125" width="660" height="19" fill="#1f6fd1"/>
  <text x="58" y="130" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#fff">PARENT · InitiativesPage.jsx</text>
  <!-- highlights -->
  <rect x="48" y="235" width="644" height="26" rx="4" fill="#d35400" opacity="0.5"/>
  <rect x="48" y="261" width="644" height="26" rx="4" fill="#7b3fd1" opacity="0.55"/>
  <rect x="48" y="365" width="644" height="26" rx="4" fill="#1e9e5a" opacity="0.55"/>
  <rect x="48" y="521" width="644" height="26" rx="4" fill="#1f6fd1" opacity="0.6"/>
  <rect x="48" y="547" width="644" height="26" rx="4" fill="#1e9e5a" opacity="0.4"/>
  <g font-family="Consolas, monospace" font-size="15" fill="#e6e6e6">
    <text x="60" y="179"><tspan fill="#c792ea">export default function</tspan> InitiativesPage() {</text>
    <text x="80" y="205">const [items, setItems] = useState([]);</text>
    <text x="80" y="253"><tspan fill="#c792ea">async function</tspan> <tspan fill="#ffcb6b" font-weight="700">handleCreate</tspan>(newData) {</text>
    <text x="100" y="279">const created = <tspan fill="#c792ea">await</tspan> apiFetch("/initiatives", {</text>
    <text x="120" y="305">method: "POST",</text>
    <text x="120" y="331">body: JSON.stringify(newData),</text>
    <text x="100" y="357">});</text>
    <text x="100" y="383">setItems((prev) =&gt; [...prev, created]);</text>
    <text x="80" y="409">}</text>
    <text x="80" y="461"><tspan fill="#c792ea">return</tspan> (</text>
    <text x="100" y="487">&lt;div&gt;</text>
    <text x="120" y="513">&lt;h1&gt;Initiatives&lt;/h1&gt;</text>
    <text x="120" y="539">&lt;<tspan fill="#8ab4ff">InitiativeForm</tspan> <tspan fill="#8ab4ff" font-weight="700">onCreate</tspan>={<tspan fill="#ffcb6b" font-weight="700">handleCreate</tspan>} /&gt;</text>
    <text x="120" y="565">&lt;ul&gt;{items.map(item =&gt; &lt;li key={item.id}&gt;...)}&lt;/ul&gt;</text>
    <text x="100" y="591">&lt;/div&gt;</text>
    <text x="80" y="617">);</text>
    <text x="60" y="643">}</text>
  </g>
  <g font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="676" cy="248" r="13" fill="#d35400"/><text x="676" y="253">4</text>
    <circle cx="676" cy="274" r="13" fill="#7b3fd1"/><text x="676" y="279">5</text>
    <circle cx="676" cy="378" r="13" fill="#1e9e5a"/><text x="676" y="383">7</text>
    <circle cx="676" cy="534" r="13" fill="#1f6fd1"/><text x="676" y="539">0</text>
    <circle cx="676" cy="560" r="13" fill="#1e9e5a"/><text x="676" y="565">8</text>
  </g>

  <!-- ===== RIGHT: CHILD ===== -->
  <rect x="800" y="100" width="660" height="570" rx="12" fill="#1e2430"/>
  <rect x="800" y="100" width="660" height="44" rx="12" fill="#1e9e5a"/><rect x="800" y="125" width="660" height="19" fill="#1e9e5a"/>
  <text x="818" y="130" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#fff">CHILD · InitiativeForm.jsx</text>
  <rect x="808" y="161" width="644" height="26" rx="4" fill="#1f6fd1" opacity="0.6"/>
  <rect x="808" y="287" width="644" height="26" rx="4" fill="#888" opacity="0.45"/>
  <rect x="808" y="339" width="644" height="26" rx="4" fill="#d35400" opacity="0.5"/>
  <rect x="808" y="365" width="644" height="26" rx="4" fill="#1e9e5a" opacity="0.4"/>
  <rect x="808" y="495" width="644" height="26" rx="4" fill="#e0b100" opacity="0.45"/>
  <rect x="808" y="521" width="644" height="26" rx="4" fill="#888" opacity="0.45"/>
  <g font-family="Consolas, monospace" font-size="15" fill="#e6e6e6">
    <text x="820" y="179"><tspan fill="#c792ea">export default function</tspan> InitiativeForm({ <tspan fill="#8ab4ff" font-weight="700">onCreate</tspan> }) {</text>
    <text x="840" y="205">const [name, setName] = useState("");</text>
    <text x="840" y="231">const [budget, setBudget] = useState(0);</text>
    <text x="840" y="257">const [status, setStatus] = useState("planned");</text>
    <text x="840" y="305"><tspan fill="#c792ea">async function</tspan> handleSubmit(e) {</text>
    <text x="860" y="331">e.preventDefault();</text>
    <text x="860" y="357"><tspan fill="#c792ea">await</tspan> <tspan fill="#8ab4ff" font-weight="700">onCreate</tspan>({ name, status, budget: Number(budget) });</text>
    <text x="860" y="383">setName("");  setBudget(0);  <tspan fill="#7f8796">// clear form</tspan></text>
    <text x="840" y="409">}</text>
    <text x="840" y="461"><tspan fill="#c792ea">return</tspan> (</text>
    <text x="860" y="487">&lt;form onSubmit={handleSubmit}&gt;</text>
    <text x="880" y="513">&lt;input value={name} onChange={(e) =&gt; setName(e.target.value)} /&gt;</text>
    <text x="880" y="539">&lt;button&gt;Add&lt;/button&gt;</text>
    <text x="860" y="565">&lt;/form&gt;</text>
    <text x="840" y="591">);</text>
    <text x="820" y="617">}</text>
  </g>
  <g font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="1440" cy="174" r="13" fill="#1f6fd1"/><text x="1440" y="179">0</text>
    <circle cx="1440" cy="300" r="13" fill="#888"/><text x="1440" y="305">2</text>
    <circle cx="1440" cy="352" r="13" fill="#d35400"/><text x="1440" y="357">3</text>
    <circle cx="1440" cy="378" r="13" fill="#1e9e5a"/><text x="1440" y="383">9</text>
    <circle cx="1440" cy="508" r="13" fill="#e0b100"/><text x="1440" y="513">1</text>
    <circle cx="1440" cy="534" r="13" fill="#888"/><text x="1440" y="539">2</text>
  </g>

  <!-- ===== cross arrows ===== -->
  <line x1="700" y1="534" x2="806" y2="180" stroke="#1f6fd1" stroke-width="5" marker-end="url(#b)"/>
  <line x1="806" y1="352" x2="702" y2="252" stroke="#d35400" stroke-width="5" marker-end="url(#o)"/>
  <rect x="706" y="420" width="88" height="54" rx="6" fill="#eaf2ff" stroke="#1f6fd1"/>
  <text x="750" y="442" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1f6fd1">0 · PROP</text>
  <text x="750" y="462" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#1f6fd1">gives function</text>
  <rect x="706" y="186" width="88" height="54" rx="6" fill="#fdf0e6" stroke="#d35400"/>
  <text x="750" y="208" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#d35400">3 · CALL</text>
  <text x="750" y="228" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#d35400">runs parent's fn</text>

  <!-- ===== BOTTOM: api.js ===== -->
  <line x1="300" y1="672" x2="300" y2="712" stroke="#7b3fd1" stroke-width="4" marker-end="url(#p)"/>
  <text x="312" y="698" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#7b3fd1">5 · apiFetch(...)</text>
  <line x1="560" y1="712" x2="560" y2="676" stroke="#1e9e5a" stroke-width="4" marker-end="url(#o)"/>
  <text x="572" y="698" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#1e9e5a">6 · returns created</text>
  <rect x="40" y="715" width="900" height="130" rx="12" fill="#f3ecff" stroke="#7b3fd1" stroke-width="2"/>
  <text x="58" y="745" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#7b3fd1">api.js · apiFetch  (9.2)</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#222">
    <text x="58" y="775">fetch("http://localhost:8000/initiatives", POST + JSON header + Bearer token)</text>
    <text x="58" y="801">  → FastAPI → saves in DB → 201 {"id": 7, "name": "AI pilot", "owner_id": 1, ...}</text>
    <text x="58" y="827">return res.json()   <tspan fill="#1e9e5a" font-weight="700">← this object becomes `created` in the parent</tspan></text>
  </g>

  <!-- mini screen result -->
  <rect x="970" y="715" width="490" height="130" rx="10" fill="#fff" stroke="#999" stroke-width="2"/>
  <text x="985" y="742" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#222">Result on screen</text>
  <rect x="985" y="752" width="140" height="26" fill="#fff" stroke="#1e9e5a" stroke-width="2"/><text x="1135" y="771" font-family="Segoe UI, Arial" font-size="13" fill="#1e9e5a">9 · form is empty again</text>
  <rect x="985" y="790" width="460" height="24" fill="#f3f3f3"/><text x="993" y="807" font-family="Segoe UI, Arial" font-size="13">Data lake · active · 900</text>
  <rect x="985" y="816" width="460" height="24" fill="#eafaf0" stroke="#1e9e5a"/><text x="993" y="833" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#1e9e5a">AI pilot · planned · 500   ← 8 · new row drawn</text>

  <!-- ===== STEPS ===== -->
  <rect x="40" y="870" width="1420" height="370" rx="12" fill="#f7f7f7" stroke="#bbb" stroke-width="2"/>
  <g font-family="Segoe UI, Arial" font-size="16" fill="#222">
    <text x="60" y="902" font-weight="700" font-size="19">The steps, in order</text>

    <circle cx="72" cy="932" r="12" fill="#1f6fd1"/><text x="72" y="937" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">0</text>
    <text x="92" y="938"><tspan font-weight="700">Parent draws the child</tspan> and passes a prop: <tspan font-family="Consolas, monospace">&lt;InitiativeForm onCreate={handleCreate} /&gt;</tspan></text>
    <text x="92" y="962" fill="#1f6fd1">React then calls <tspan font-family="Consolas, monospace">InitiativeForm({ onCreate: handleCreate })</tspan> → inside the child, <tspan font-weight="700">onCreate is just a 2nd NAME for handleCreate</tspan></text>

    <circle cx="72" cy="992" r="12" fill="#e0b100"/><text x="72" y="997" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">1</text>
    <text x="92" y="998"><tspan font-weight="700">You type</tspan> → onChange → setName → the CHILD's own state holds "AI pilot"  (9.4 loop)</text>

    <circle cx="72" cy="1022" r="12" fill="#888"/><text x="72" y="1027" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">2</text>
    <text x="92" y="1028"><tspan font-weight="700">You click Add</tspan> → &lt;form onSubmit={handleSubmit}&gt; → the child's handleSubmit runs</text>

    <circle cx="72" cy="1052" r="12" fill="#d35400"/><text x="72" y="1057" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">3</text>
    <text x="92" y="1058"><tspan font-weight="700">Child calls onCreate({ name, status, budget })</tspan> → since onCreate = handleCreate, the <tspan font-weight="700">PARENT's</tspan> function runs</text>

    <circle cx="72" cy="1082" r="12" fill="#d35400"/><text x="72" y="1087" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">4</text>
    <text x="92" y="1088"><tspan font-weight="700">handleCreate(newData)</tspan> starts in the parent file — newData = {name: "AI pilot", status: "planned", budget: 500}</text>

    <circle cx="72" cy="1112" r="12" fill="#7b3fd1"/><text x="72" y="1117" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">5</text>
    <text x="92" y="1118"><tspan font-weight="700">apiFetch</tspan> sends POST /initiatives with the token (api.js) → FastAPI saves it</text>

    <circle cx="72" cy="1142" r="12" fill="#1e9e5a"/><text x="72" y="1147" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">6</text>
    <text x="92" y="1148"><tspan font-weight="700">FastAPI answers 201</tspan> with the saved row → <tspan font-family="Consolas, monospace">created = {id: 7, ...}</tspan></text>

    <circle cx="72" cy="1172" r="12" fill="#1e9e5a"/><text x="72" y="1177" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">7</text>
    <text x="92" y="1178"><tspan font-weight="700">setItems(prev =&gt; [...prev, created])</tspan> → the PARENT's state changes</text>

    <circle cx="72" cy="1202" r="12" fill="#1e9e5a"/><text x="72" y="1207" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">8</text>
    <text x="92" y="1208"><tspan font-weight="700">Parent re-renders</tspan> → items.map draws the new &lt;li&gt; → new row on screen</text>

    <circle cx="772" cy="1202" r="12" fill="#1e9e5a"/><text x="772" y="1207" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">9</text>
    <text x="792" y="1208"><tspan font-weight="700">Back in the child</tspan>: await is done → setName("") → form empties</text>
  </g>

  <rect x="40" y="1255" width="1420" height="60" rx="10" fill="#fff6d6" stroke="#e0b100" stroke-width="2"/>
  <text x="60" y="1292" font-family="Segoe UI, Arial" font-size="18" fill="#222"><tspan font-weight="700">Analogy:</tspan> a prop is like giving someone your phone number. The form doesn't know HOW to save — it just "calls" the number it was given.</text>
</svg>
