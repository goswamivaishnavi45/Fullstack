<rect x="40" y="465" width="1100" height="170" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="64" y="499" font-size="17" font-weight="700" fill="#0f172a">How to read it</text>
<text x="64" y="531" font-size="14" fill="#334155">• <tspan font-weight='700'>1 user → N initiatives</tspan>: initiatives.owner_id stores the id of the user who owns it (foreign key on the "many" side).</text>
<text x="64" y="559" font-size="14" fill="#334155">• <tspan font-weight='700'>1 initiative → N milestones</tspan>: milestones.initiative_id points to its parent. Deleting an initiative deletes its milestones (cascade).</text>
<text x="64" y="587" font-size="14" fill="#334155">• relationship() is NOT a column - it is a Python shortcut, e.g. user.initiatives or milestone.initiative.</text>
<rect x="64" y="601" width="30" height="20" rx="5" fill="#7c3aed"/>
<text x="79" y="615" text-anchor="middle" font-size="11" font-weight="700" fill="white">PK</text>
<text x="104" y="615" font-size="13" fill="#475569">primary key (unique id)</text>
<rect x="394" y="601" width="30" height="20" rx="5" fill="#dc2626"/>
<text x="409" y="615" text-anchor="middle" font-size="11" font-weight="700" fill="white">FK</text>
<text x="434" y="615" font-size="13" fill="#475569">foreign key (points to another table)</text>
<rect x="724" y="601" width="30" height="20" rx="5" fill="#0891b2"/>
<text x="739" y="615" text-anchor="middle" font-size="11" font-weight="700" fill="white">UQ</text>
<text x="764" y="615" font-size="13" fill="#475569">unique (no duplicates)</text>
</svg>